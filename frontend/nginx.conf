server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Вызов локальной модели или CLI идёт минутами — дефолтные 60 с его обрывают
        proxy_read_timeout 600s;
    }

    # SPA: любой путь интерфейса отдаёт index.html, маршрут разбирает vue-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
